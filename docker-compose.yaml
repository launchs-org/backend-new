name: launchs-org

# ─────────────────────────────────────────────────────────────────────────────
# メイン compose ファイル。インフラ（DB・Redis）と共通ネットワークを定義する。
# アプリ層は compose.app.yaml、Temporal 層は compose.temporal.yaml に分割。
#
# 起動: docker compose -f docker-compose.yaml -f compose.app.yaml -f compose.temporal.yaml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    hostname: db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: root
      TZ: Asia/Tokyo
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./database/script/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - host_network

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - host_network

volumes:
  dbdata:
    driver: local

networks:
  host_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
